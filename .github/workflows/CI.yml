name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3-py311 produces one wheel for CPython 3.11 and newer.
          args: --release --locked --out dist --interpreter python3.11
          manylinux: '2014'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --interpreter python
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test ${{ matrix.platform.artifact }} on Python ${{ matrix.python-version }}
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        platform:
          - runner: ubuntu-latest
            artifact: linux-x86_64
          - runner: windows-latest
            artifact: windows-x64
          - runner: macos-15-intel
            artifact: macos-x86_64
          - runner: macos-latest
            artifact: macos-aarch64
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.platform.artifact }}
          path: dist
      - name: Install wheel
        run: |
          python -m pip install --no-index --find-links dist --only-binary=:all: nrpys
      - name: Smoke test Python bindings
        shell: python
        run: |
          import nrpys

          config = nrpys.Config()
          config.fungal = True
          assert config.fungal is True
          assert config.categories
          assert config.categories == config.categories
          category = nrpys.PredictionCategory.ThreeClusterV3
          assert category == 0
          assert category != nrpys.PredictionCategory.SingleV3
          domain = nrpys.ADomain("domain", "A" * 34)
          assert domain.name == "domain"
          assert domain.aa34 == "A" * 34
          assert domain.get_best(category) == []
          assert domain.get_stachelhaus() == []
          try:
              nrpys.run(config, ["domain"], [])
          except ValueError as error:
              assert "same length" in str(error)
          else:
              raise AssertionError("Expected ValueError for mismatched input lengths")

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [linux, windows, macos, sdist, test]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*
